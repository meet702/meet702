<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.5" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="300" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#00c6ff"/>
      <stop offset="1" stop-color="#ffffff"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="300 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="reveal">
      <rect x="120" y="30" height="90" width="0">
        <animate attributeName="width" from="0" to="660" begin="0.3s" dur="1.8s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>
  <rect width="900" height="150" rx="16" fill="url(#bg)"/>
  <circle cx="90" cy="110" r="60" fill="#00c6ff" opacity="0.08">
    <animate attributeName="cy" values="110;90;110" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="820" cy="50" r="80" fill="#00c6ff" opacity="0.07">
    <animate attributeName="cy" values="50;80;50" dur="7s" repeatCount="indefinite"/>
  </circle>
  <g clip-path="url(#reveal)">
    <text x="450" y="90" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="46" font-weight="700" fill="url(#name)">Hi, I'm Meet Chhabhaiya</text>
  </g>
  <rect x="770" y="52" width="3" height="42" fill="#00c6ff">
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>
</svg>
