<svg xmlns="http://www.w3.org/2000/svg" width="900" height="70" viewBox="0 0 900 70" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="300" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#00c6ff"/>
      <stop offset="0.5" stop-color="#6a5cff"/>
      <stop offset="1" stop-color="#00c6ff"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="300 0" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.1s" dur="0.7s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 18" to="0 0" begin="0.1s" dur="0.7s" fill="freeze"/>
    <text x="450" y="42" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="34" font-weight="700" fill="url(#g)">Certifications</text>
  </g>
  <rect x="450" y="56" width="0" height="4" rx="2" fill="url(#g)">
    <animate attributeName="width" from="0" to="240" begin="0.5s" dur="0.9s" fill="freeze"/>
    <animate attributeName="x" from="450" to="330" begin="0.5s" dur="0.9s" fill="freeze"/>
  </rect>
</svg>
